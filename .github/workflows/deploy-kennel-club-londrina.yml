name: Deploy Kennel Club de Londrina

on:
  push:
    branches: [main]
    paths:
      - 'apps/kennel-club-londrina/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:kcl

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          external_repository: kdsnunes/kennelclublondrina
          publish_branch: gh-pages
          publish_dir: ./apps/kennel-club-londrina/dist
